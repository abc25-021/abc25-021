<!DOCTYPE html>
<html>
  <head>
    <!--nav and title here-->
    <title>Chrome Hearts</title>
    <meta charset = "utf-8">
    <style>
      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
      }
      #sitetitle{
        text-transform: uppercase;
        font-family: "Cloister Black",serif;
        display: flex;
         text-align: center;
        justify-content: center;
        gap:15px;
        margin: 0; /*remove default h1 margin*/
        font-size:24px;
        position:sticky;
        top:0;
        }
        .logo{
          width: auto;
          height: 40px;
          display:block;
        }
      body{
        margin:0;
        font-family: Arial, sans-serif;
      }
      #siteheader{
        background:#111;
        color:white;
        padding:15px 30px;
        text-align:centre;
        justify-content: space-between;
        position: sticky; /*add this*/
        z-index:10; /* add this*/
        position:sticky;
        top:0;
        display:flex;
      }
      #sitenav li:hover{
        background: transparent;
        margin:0;
        text-align: left;
      }
      #sitenav a:hover{
        background:#777
      }
      /*Make the nav list horizontal*/
      #ulnav{
        list-style-type: none; /*remove bullets*/
        margin:0;
        padding:0;
        display:flex;
        gap:25px; /*space between links*/
      }
      #ulnav a{
        color:white;
        text-decoration: none;
        padding: 8px 12px;
        font-family: Arial, Helvetica, sans-serif;
      }
      #ulnav a:hover{
        text-decoration: underline;
      }
      .signin-btn{
        background:white;
        color:#111;
        padding:8px 16px;
        border-radius:4px;
        text-decoration:none;
        font-weight:bold;
        font-family:Arial, sans-serif;
      }
      .signin-btn:hover{
        background:#ddd;
      }
      footer{
        background:#111;
        color:white;
        text-align:center;
        padding:20px 30px;
        position:sticky;
        bottom:0;
        display:flex;
        justify-content: center;    
      }
        main{
            flex:1;
        }
        
      </style>
  </head>
  <head>
    <title>Sign In- Chrome hearts</title>
    <link rel = "stylesheet" href = "style.css">
  </head>
     <body> 
    <div id = "divmaincontainer">
      <header id = "siteheader">
        <h1 id = "sitetitle"><img src = "logo.png" alt = "Chrome Hearts" class = "logo">Chrome Hearts</h1>
        <nav id = "sitenav">
        <ul id = "ulnav">
           <li><a href = "index.html">Home</a></li>
           <li><a href = "About Us.html">About Us</a></li>
           <li><a href = "Products.html">Products</a></li>
           <li><a href = "Services.html">Services</a></li>
           <li><a href = "signin.html">Sign In</a></li>
        </ul>
      </nav>
      </header>
      <main class = "auth-page">
        <div>
          <h2>Sign In</h2>
          <form id = "signin-form">
            <label>Email</label>
            <input type = "email" id = "email" required>
            <label>Password</label>
            <input type = "password" id = "password" required>
            <button type = "submit">Sign In</button>
          </form>
          <p id = "login-message"></p>
        </div>
      </main>
    </div>
     
     <footer>
      <p>&copy; 2024 Chrome Hearts. All rights reserved.</p>
       <section id = "social media">
                <a href = "facebook.com"><img src = "FB.jpg"></a>
                 <a href = "chromehearts.com"><img src = "IG.jpg"></a>
                 <a href = "twitter.com"><img src = "X.jpg"></a>
    </section>
    </footer>
    </body>
     <script>
         const form = document.getElementById('signin-form');
         const messageEl = document.getElementById('login-message');
         
         form.addEventListener('submit', (e) => {
             e.preventDefault();
             const email = document.getElementById('email').value;
             const password = document.getElementById('password').value;
             
             // Simulate login validation
             if(email === 'user@example.com' && password === 'password') {
                 messageEl.textContent = 'Login successful!';
                 messageEl.style.color = 'green';
             } else {
                 messageEl.textContent = 'Invalid email or password.';
                 messageEl.style.color = 'red';
             }
         });
     </script>

</html>
