<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Chrome Hearts</title>
    <link rel="stylesheet" href="stylesheet/style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <div class="logo">CHROME HEARTS</div>
      <div class="nav-right">
        <div class="nav-links" id="nav-links">
          <a href="index.html">Homepage</a>
          <a href="about-us.html">About Us</a>
          <a href="Products.html">Products</a>
          <a href="Services.html">Services</a>
          <a href="SignIn.html">Sign In</a>
        </div>
        <button class="hamburger" id="hamburger">☰</button>
      </div>
    </nav>
  </header>
 
  <main class="form-wrapper">
    <div class="form-container">
      <h2>SIGN UP</h2>
      <form onsubmit="alert('Sign up functionality would go here'); return false;">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required>
        </div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
      <div class="form-footer">
        Already have an account? <a href="SignIn.html">Sign In</a>
      </div>
    </div>
  </main>
 
  <footer>
    <p>&copy; 2026 Chrome Hearts. All rights reserved.</p>
    <section class="social-links">
      <a href="https://www.chromehearts.com/on/demandware.store/Sites-ChromeHearts-Site/en_US/Default-Start" target="_blank">
        <img src="logo2.jpg" alt="Chrome Hearts Website">
      </a>
      <a href="https://www.instagram.com/chromeheartsofficial/" target="_blank">
        <img src="image9.jpg" alt="Instagram">
      </a>
      <a href="https://x.com/chromeheartsusa" target="_blank">
        <img src="image8.jpg" alt="X">
      </a>
    </section>
  </footer>
 
  <script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');
    hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));
  </script>
</body>
</html>
